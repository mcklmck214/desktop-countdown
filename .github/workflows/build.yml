name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name wmxgj_Beta0_8
          --hidden-import pystray._win32
          --add-data "lang.json;."
          --add-data "image.png;."
          wmxgj_Beta0_8.py

      - uses: actions/upload-artifact@v4
        with:
          name: wmxgj-windows
          path: dist/*

  linux:
    name: Linux (Ubuntu 20.04 / glibc 2.31)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-dev python3-pip python3-tk

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: >
          python3 -m PyInstaller --noconfirm --clean --onefile --windowed
          --name wmxgj_Beta0_8-linux-x86_64
          --hidden-import pystray._xorg
          --add-data "lang.json:."
          --add-data "image.png:."
          wmxgj_Beta0_8.py

      - uses: actions/upload-artifact@v4
        with:
          name: wmxgj-linux
          path: dist/*

  release:
    name: Upload Release Assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
